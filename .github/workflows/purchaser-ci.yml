name: Purchaser Repo Guardrails CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  purchaser-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Purchaser Guardrails (SoD, PII, CSV Schema)
        run: python scripts/ci_purchaser_guard.py
